plugins {
    id 'java-library'
    id 'jacoco'
    id 'checkstyle'
    alias(libs.plugins.micronautApplication)
    alias(libs.plugins.gitProperties)
    id 'io.fabric8.java-generator' version '8.0.0'
}

micronaut {
    runtime("netty")
}

application {
    mainClass.set('com.enonic.kubernetes.operator.helpers.Main')
}

def modelMetadataDir = layout.buildDirectory.dir( 'generated/native-image/models' )

def generateModelMetadata = tasks.register( 'generateModelMetadata' ) {
    description = 'Registers the Kubernetes model classes the operator reads and writes for reflection in the native image'
    def modelPackages = ['io/fabric8/kubernetes/api/model/', 'io/fabric8/kubernetes/api/model/admission/v1/',
                         'io/fabric8/kubernetes/api/model/apps/', 'io/fabric8/kubernetes/api/model/authentication/',
                         'io/fabric8/kubernetes/api/model/networking/v1/', 'io/fabric8/kubernetes/api/model/rbac/']
    def crdPackage = 'com/enonic/kubernetes/crd/'
    def classpath = configurations.runtimeClasspath
    def classesDirs = sourceSets.main.output.classesDirs
    def outputFile = modelMetadataDir.map { it.file( 'reachability-metadata.json' ) }
    inputs.files( classpath, classesDirs )
    outputs.file( outputFile )
    dependsOn tasks.named( 'compileJava' )
    doLast {
        def isModel = { String path ->
            if ( !path.endsWith( '.class' ) || path ==~ /.*(Builder|Fluent)(\$.*)?\.class/ ) {
                return false
            }
            path.startsWith( crdPackage ) || modelPackages.contains( path.substring( 0, path.lastIndexOf( '/' ) + 1 ) )
        }
        def types = new TreeSet<String>( ['io/fabric8/kubernetes/client/CustomResource.class'] )
        classpath.files.findAll { it.name.startsWith( 'kubernetes-model-' ) }.each { jar ->
            new java.util.zip.ZipFile( jar ).withCloseable { zip ->
                zip.entries().each { if ( isModel( it.name ) ) types.add( it.name ) }
            }
        }
        classesDirs.each { dir ->
            fileTree( dir ).visit { if ( !it.directory && isModel( it.relativePath.pathString ) ) types.add( it.relativePath.pathString ) }
        }
        def reflection = types.collect {
            [type: it.replace( '/', '.' ) - '.class', allDeclaredFields: true, allDeclaredMethods: true, allDeclaredConstructors: true]
        }
        outputFile.get().asFile.text = groovy.json.JsonOutput.prettyPrint( groovy.json.JsonOutput.toJson( [reflection: reflection] ) )
    }
}

graalvmNative {
    binaries {
        main {
            imageName = 'xp-operator'
            sharedLibrary = false
            buildArgs.addAll( '-H:+AddAllCharsets', '--static-nolibc', '-march=compatibility' )
            configurationFileDirectories.from( files( modelMetadataDir ).builtBy( generateModelMetadata ) )
        }
    }
}

javaGen {
    source = file("${rootDir}/helm/src/main/crds")
    target = file("${buildDir}/generated/sources/crds/java")
    packageOverrides = ['cloud.enonic.v1': 'com.enonic.kubernetes.crd.v1']
}

checkstyle {
    toolVersion = libs.versions.checkstyle.get()
    configFile = rootProject.file( 'checkstyle.xml' )
}

tasks.named('checkstyleMain') {
    source = fileTree( 'src/main/java' )
}

sourceSets.main.java.srcDirs += "${buildDir}/generated/sources/crds/java"
tasks.named('compileJava') { dependsOn 'crd2java' }
tasks.named('crd2java') { dependsOn ':helm:processHelmResources' }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}


dependencies {
    implementation platform(libs.fabric8.bom)

    implementation 'io.fabric8:generator-annotations'
    api libs.fabric8.kubernetes.clientapi
    implementation libs.fabric8.kubernetes.client

    implementation libs.jackson.dataformat.yaml
    implementation libs.pebble
    implementation libs.jspecify

    implementation 'jakarta.inject:jakarta.inject-api'

    implementation 'io.micronaut:micronaut-http-server-netty'
    implementation 'io.micronaut:micronaut-jackson-databind'

    runtimeOnly 'ch.qos.logback:logback-classic:1.5.37'

    testImplementation 'io.rest-assured:rest-assured'
    testImplementation libs.fabric8.kubernetes.servermock
    testImplementation libs.mockito.inline
    testImplementation libs.assertj.core
    testImplementation libs.mockito.junitjupiter

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter.api
    testImplementation 'io.fabric8:zjsonpatch'
    testRuntimeOnly libs.junit.jupiter.engine
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
    useJUnitPlatform()
}
