admissionRequest:
  request:
    operation: CREATE
    object:
      apiVersion: enonic.cloud/v1
      kind: Xp8Deployment
      metadata:
        name: mycloud-mysolution-myenv-myservice2
        namespace: mycloud-mysolution-myenv-myservice2
        labels:
          cloud: mycloud
          solution: mysolution
          environment: myenv
          service: myservice2
      spec:
        enabled: true
        xpVersion: 8.2.0
        nodesSharedDisks:
          - name: blobstore
            size: 1Gi
          - name: snapshots
            size: 1Gi
        nodeGroups:
          - name: main
            master: true
            data: true
            replicas: 1
            secretMounts:
              - name: blobstore
                secretName: juke-service-account-key
                mountPath: /enonic-xp/home/keys
            resources:
              cpu: "1"
              memory: 512Mi
              disks:
                - name: index
                  size: 200Mi

assertException: "'spec.nodeGroups[0].secretMounts[0].name' with value 'blobstore' is already the name of another volume"
