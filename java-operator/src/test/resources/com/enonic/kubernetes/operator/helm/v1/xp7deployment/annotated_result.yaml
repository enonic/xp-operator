    kind: "PersistentVolumeClaim"
    metadata:
      labels:
        cloud: "mycloud"
        enonic.managed: "true"
        enonic.nodeGroup: "fisk"
        environment: "myenv"
        service: "myservice"
        solution: "mysolution"
      name: "export"
    spec:
      accessModes:
      - "ReadWriteOnce"
      resources:
        requests:
          storage: "234Mi"
      storageClassName: "standard"
      volumeMode: "Filesystem"
  - apiVersion: "v1"
    kind: "PersistentVolumeClaim"
    metadata:
      labels:
        cloud: "mycloud"
        enonic.managed: "true"
        enonic.nodeGroup: "fisk"
        environment: "myenv"
        service: "myservice"
        solution: "mysolution"
      name: "index"
    spec:
      accessModes:
      - "ReadWriteOnce"
      resources:
        requests:
          storage: "200Mi"
      storageClassName: "standard"
      volumeMode: "Filesystem"
  - apiVersion: "v1"
    kind: "PersistentVolumeClaim"
    metadata:
      labels:
        cloud: "mycloud"
        enonic.managed: "true"
        enonic.nodeGroup: "fisk"
        environment: "myenv"
