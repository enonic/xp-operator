        enonic.data: "true"
        enonic.deployment: "mycloud-mysolution-myenv-myservice"
        enonic.managed: "true"
        enonic.master: "true"
        enonic.nodeGroup: "fisk"
        environment: "myenv"
        service: "myservice"
        solution: "mysolution"
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: "NAMESPACE"
          valueFrom:
