            \ -Dhazelcast.shutdownhook.policy=GRACEFUL -Dhazelcast.graceful.shutdown.max.wait=600"
        image: "enonic/xp:7.13.0-ubuntu"
        imagePullPolicy: "IfNotPresent"
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: "/health"
            port: 2609
            scheme: "HTTP"
          timeoutSeconds: 2
