              key: "token"
              name: "xp-events-sa-secret"
        - name: "K8S_CA_CRT_PATH"
          value: "/etc/k8s-ca.crt"
        - name: "XP_CONFIG_PATH"
          value: "/enonic-xp/home/config"
        - name: "POD_CONFIG_RELOADED_ANNOTATION"
          value: "enonic.cloud/configReloaded"
        image: "alpine/curl"
        imagePullPolicy: "IfNotPresent"
        name: "events"
