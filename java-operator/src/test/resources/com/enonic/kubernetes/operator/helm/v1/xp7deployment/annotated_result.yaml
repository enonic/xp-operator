data:
  pod-annotator.sh: "#!/bin/sh\nset -e\n\nPOD_NAME=\"$(hostname)\"\nAPI=\"https://kubernetes.default.svc/api/v1/namespaces/${NAMESPACE}/pods/${POD_NAME}\"\
    \n\nnow() {\n  date -u +\"%Y-%m-%dT%H:%M:%SZ\"\n}\n\nhash_config() {\n  find \"\
    ${XP_CONFIG_PATH}\" -maxdepth 1 -type l 2>/dev/null \\\n    | grep -v \"${XP_CONFIG_PATH}/\\\
    .\\.\" \\\n    | xargs sha1sum 2>/dev/null \\\n    | awk '{print $1}' \\\n   \
    \ | xargs echo\n}\n\npatch_annotation() {\n  TIMESTAMP=\"$(now)\"\n  log \"Detected\
    \ config change, setting ${POD_CONFIG_RELOADED_ANNOTATION} = ${TIMESTAMP}\"\n\n\
    \  RESPONSE=$(curl -s -w \"\\n%{http_code}\" -X PATCH \"${API}\" \\\n    -H \"\
    Authorization: Bearer $K8S_TOKEN\" \\\n    -H \"Content-Type: application/merge-patch+json\"\
    \ \\\n    --cacert \"${K8S_CA_CRT_PATH}\" \\\n    -d \"{\\\"metadata\\\": {\\\"\
    annotations\\\": {\\\"${POD_CONFIG_RELOADED_ANNOTATION}\\\": \\\"${TIMESTAMP}\\\
    \"}}}\")\n\n  BODY=$(echo \"$RESPONSE\" | head -n -1)\n  CODE=$(echo \"$RESPONSE\"\
    \ | tail -n1)\n\n  if [ \"$CODE\" -ge 200 ] && [ \"$CODE\" -lt 300 ]; then\n \
    \   log \"Successfully patched pod annotation\"\n  else\n    log \"Failed to patch\
    \ pod. HTTP $CODE. Response body:\"\n    echo \"$BODY\"\n  fi\n}\n\nlog() {\n\
    \  echo \"$(now) $@\"\n}\n\n# Handle graceful shutdown\ntrap 'log \"Received termination\
    \ signal, exiting.\"; exit 0' TERM INT\n\nLAST_HASH=\"\"\n\nlog \"Starting config\
    \ reload watcher\"\nlog \"Watching: ${XP_CONFIG_PATH}, annotating: ${POD_CONFIG_RELOADED_ANNOTATION}\"\
    \n\nwhile true; do\n  CURRENT_HASH=\"$(hash_config)\"\n  if [ \"$CURRENT_HASH\"\
    \ != \"$LAST_HASH\" ]; then\n    LAST_HASH=\"$CURRENT_HASH\"\n    patch_annotation\n\
    \  fi\n  sleep 2\ndone\n"
  vhost-defaults.cfg: "enabled = true\n\nmapping.localhost.host = localhost\nmapping.localhost.source\
    \ = /\nmapping.localhost.target = /\nmapping.localhost.idProvider.system = default"
