apiVersion: "v1"
kind: "ConfigMap"
metadata:
  annotations:
    enonic.applyPriority: "60"
  labels:
    cloud: "mycloud"
    enonic.managed: "true"
    environment: "myenv"
    service: "myservice"
    solution: "mysolution"
  name: "extra-config"
  namespace: "mycloud-mysolution-myenv-myservice"
  ownerReferences:
