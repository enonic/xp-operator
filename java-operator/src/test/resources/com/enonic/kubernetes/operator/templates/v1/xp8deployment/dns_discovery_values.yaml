---
allNodesKey: "all"
annotationKeys:
  applyPriority: "enonic.applyPriority"
  configMapUpdated: "enonic.cloud/lastUpdated"
  ingressCertManage: "enonic.cloud/ingress.cert.manage"
  neverOverwrite: "enonic.neverOverwrite"
  podConfigReloaded: "enonic.cloud/configReloaded"
  removeWithDeployment: "enonic.cloud/remove.with.xp8deployment"
  vhostMapping: "enonic.cloud/xp8.vhost.mapping."
clusterId: "44ddc40b-266c-4c99-b094-e758328fc6ba"
defaultLabels:
  cloud: "mycloud"
  environment: "myenv"
  service: "myservice"
  solution: "mysolution"
deployment:
  clusterMajority: 5
  clustered: true
  hasDedicatedFrontendNodes: true
  minimumDataNodes: 2
  minimumMasterNodes: 2
  name: "mycloud-mysolution-myenv-myservice"
  namespace: "mycloud-mysolution-myenv-myservice"
  spec:
    enabled: true
    nodeGroups:
    - data: false
      env:
      - name: "XP_OPTS"
        value: "-Xms512m -Xmx512m -XX:-HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/enonic-xp/home/data/oom.hprof\
          \ -Dhazelcast.shutdownhook.policy=GRACEFUL -Dhazelcast.graceful.shutdown.max.wait=600"
      initContainers: []
      master: true
      name: "master"
      replicas: 3
      resources:
        cpu: "1"
        dirs: []
        disks:
        - name: "export"
          size: "3Gi"
        memory: "1Gi"
        volumes: []
      secretMounts: []
      sidecars: []
    - data: true
      env:
      - name: "XP_OPTS"
        value: "-Xms614m -Xmx614m -XX:-HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/enonic-xp/home/data/oom.hprof\
          \ -Dhazelcast.shutdownhook.policy=GRACEFUL -Dhazelcast.graceful.shutdown.max.wait=600"
      initContainers: []
      master: false
      name: "data"
      replicas: 2
      resources:
        cpu: "2"
        dirs: []
        disks:
        - name: "export"
          size: "4Gi"
        - name: "index"
          size: "5Gi"
        memory: "2Gi"
        volumes: []
      secretMounts: []
      sidecars: []
    - data: false
      env:
      - name: "CUSTOM_ENV"
        value: "myenvvar"
      - name: "XP_OPTS"
        value: "-bla -Xms1536m -Xmx1536m -XX:-HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/enonic-xp/home/data/oom.hprof\
          \ -Dhazelcast.shutdownhook.policy=GRACEFUL -Dhazelcast.graceful.shutdown.max.wait=600"
      initContainers: []
      master: false
      name: "frontend"
      replicas: 3
      resources:
        cpu: "3"
        dirs: []
        disks:
        - name: "export"
        - name: "work"
        memory: "3Gi"
        volumes: []
      secretMounts: []
      sidecars: []
    nodesSharedDisks:
    - name: "blobstore"
      size: "1Gi"
    - name: "snapshots"
      size: "2Gi"
    nodesSharedVolumes: []
    xpVersion: "8.2.0"
dirs:
  config: "/enonic-xp/home/config"
  extraConfig: "/enonic-xp/home/extra-config"
discoveryService: "cluster-discovery"
events:
  image: "alpine/curl"
files:
  setEnv: "/enonic-xp/home/setenv.sh"
  vhosts: "com.enonic.xp.web.vhost.cfg"
image:
  nameTemplate: "enonic/xp:%s-ubuntu"
  pullPolicy: "IfNotPresent"
  registryPrefix: ""
labelKeys:
  data: "enonic.data"
  deployment: "enonic.deployment"
  ingressVhostLoaded: "enonic.cloud/vhost-loaded"
  managed: "enonic.managed"
  master: "enonic.master"
  nodeGroup: "enonic.nodeGroup"
operator:
  hazelcastClusterRoleName: "xp-operator-hazelcast"
  name: "xp-operator"
ownerReferences:
- apiVersion: "enonic.cloud/v1"
  kind: "Xp8Deployment"
  blockOwnerDeletion: false
  controller: true
  name: "mycloud-mysolution-myenv-myservice"
pods:
  automountServiceAccountToken: true
  imagePullSecretNames: ""
  nodeGroupAntiAffinity: false
  preStopSleepSeconds: "15"
  probes:
    liveness:
      failureThreshold: "10"
      periodSeconds: "10"
      timeoutSeconds: "2"
    readiness:
      failureThreshold: "2"
      periodSeconds: "10"
      timeoutSeconds: "2"
    startup:
      failureThreshold: "55"
      initialDelaySeconds: "5"
      periodSeconds: "2"
      timeoutSeconds: "2"
  readOnlyRootFilesystem: false
  securityContext:
    fsGroup: "1337"
    user: "1337"
  sysctlInitContainer: true
  terminationGracePeriodSeconds: "600"
  updateStrategy: "RollingUpdate"
resources:
  cpu:
    defaultRequests: null
  memory:
    defaultRequests: null
settings:
  hzApiDiscovery: false
  linkerd: false
storage:
  default:
    storageClassName: "standard"
  shared:
    storageClassName: "standard"
sysctlInitContainer:
  image: "busybox"
volumes:
  mounts:
    blobstore: "/enonic-xp/home/repo/blob"
    deploy: "/enonic-xp/home/deploy"
    export: "/enonic-xp/home/data"
    index: "/enonic-xp/home/repo/index"
    snapshots: "/enonic-xp/home/snapshots"
    work: "/enonic-xp/home/work"
waitForDnsDiscovery:
  image: "busybox"
