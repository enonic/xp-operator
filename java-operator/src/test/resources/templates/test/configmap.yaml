apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ name }}
  labels: {{ labels | toJson }}
  annotations:
    {%- for e in annotations | entries %}
    {{ e.key }}: {{ e.value }}
    {%- endfor %}
data:
  greeting: "hello {{ name | raw }}"
  included: {{ file("included.txt") }}
  missing: {{ missing }}
