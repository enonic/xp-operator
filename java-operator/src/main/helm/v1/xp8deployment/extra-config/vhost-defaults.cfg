enabled = true

mapping.localhost.host = localhost
mapping.localhost.source = /
mapping.localhost.target = /
mapping.localhost.idProvider.system = default
{{- if .Values.settings.cloudApiServiceAccount }}
{{- range $nodeGroup := .Values.deployment.spec.nodeGroups }}

mapping.k8s-{{ $nodeGroup.name }}.host = {{ $nodeGroup.name }}.{{ $.Values.deployment.namespace }}.svc
mapping.k8s-{{ $nodeGroup.name }}.source = /
mapping.k8s-{{ $nodeGroup.name }}.target = /
mapping.k8s-{{ $nodeGroup.name }}.endpoint = management
mapping.k8s-{{ $nodeGroup.name }}.idProvider.enonic-cloud = default
mapping.k8s-{{ $nodeGroup.name }}.idProvider.enonic-cloud.flows = autologin,k8s
mapping.k8s-{{ $nodeGroup.name }}.allow = role:system.admin
{{- end }}
{{- end }}