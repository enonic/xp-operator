# System properties. su can log in only when a node group's env sets XP_SU_PASSWORD to its password hash
apiVersion: enonic.cloud/v1
kind: Xp8Config
metadata:
  name: "{{ allNodesKey | raw }}-system"
  namespace: {{ deployment.namespace }}
  annotations:
    {{ annotationKeys.neverOverwrite }}: true
    {{ annotationKeys.applyPriority }}: "70"
  labels:
    {{ labelKeys.managed }}: true
    {%- for e in defaultLabels | entries %}
    {{ e.key }}: {{ e.value }}
    {%- endfor %}
  ownerReferences: {{ ownerReferences | toJson }}
spec:
  nodeGroup: {{ allNodesKey }}
  file: system.properties
  dataBase64: false
  data: |-
    xp.name = {{ deployment.name | raw }}
    xp.suPassword = ${env.XP_SU_PASSWORD}
---
# Disable tour in admin
apiVersion: enonic.cloud/v1
kind: Xp8Config
metadata:
  name: "{{ allNodesKey | raw }}-admin"
  namespace: {{ deployment.namespace }}
  annotations:
    {{ annotationKeys.neverOverwrite }}: true
    {{ annotationKeys.applyPriority }}: "70"
  labels:
    {{ labelKeys.managed }}: true
    {%- for e in defaultLabels | entries %}
    {{ e.key }}: {{ e.value }}
    {%- endfor %}
  ownerReferences: {{ ownerReferences | toJson }}
spec:
  nodeGroup: {{ allNodesKey }}
  file: com.enonic.xp.app.main.cfg
  dataBase64: false
  data: |-
    tourDisabled = true
---
# Cluster configuration
apiVersion: enonic.cloud/v1
kind: Xp8Config
metadata:
  name: "{{ allNodesKey | raw }}-cluster"
  namespace: {{ deployment.namespace }}
  annotations:
    {{ annotationKeys.applyPriority }}: "70"
  labels:
    {{ labelKeys.managed }}: true
    {%- for e in defaultLabels | entries %}
    {{ e.key }}: {{ e.value }}
    {%- endfor %}
  ownerReferences: {{ ownerReferences | toJson }}
spec:
  nodeGroup: {{ allNodesKey }}
  file: com.enonic.xp.cluster.cfg
  dataBase64: false
  data: |-
    network.host=0.0.0.0
    network.publish.host=${env.XP_NODE_IP}
    node.name=${env.XP_NODE_NAME}
    cluster.enabled={{ deployment.clustered | raw }}
{%- if deployment.clustered %}
---
# Hazelcast configuration
apiVersion: enonic.cloud/v1
kind: Xp8Config
metadata:
  name: "{{ allNodesKey | raw }}-hazelcast"
  namespace: {{ deployment.namespace }}
  annotations:
    {{ annotationKeys.applyPriority }}: "70"
  labels:
    {{ labelKeys.managed }}: true
    {%- for e in defaultLabels | entries %}
    {{ e.key }}: {{ e.value }}
    {%- endfor %}
  ownerReferences: {{ ownerReferences | toJson }}
spec:
  nodeGroup: {{ allNodesKey }}
  file: com.enonic.xp.hazelcast.cfg
  dataBase64: false
  data: |-
    clusterConfigDefaults=false
    system.hazelcast.initial.min.cluster.size=${env.XP_HZ_MIN_SIZE}
    network.join.tcpIp.enabled=false
    network.join.kubernetes.enabled=true
    {%- if settings.hzApiDiscovery %}
    network.join.kubernetes.serviceName={{ discoveryService | raw }}
    network.join.kubernetes.namespace={{ deployment.namespace | raw }}
    network.join.kubernetes.kubernetesApiRetries=10
    network.join.kubernetes.resolveNotReadyAddresses=true
    partition.group.enabled=true
    partition.group.groupType=NODE_AWARE
    {%- else %}
    network.join.kubernetes.serviceDns={{ discoveryService | raw }}.{{ deployment.namespace | raw }}.svc.cluster.local
    {%- endif %}
{%- endif %}
---
# Logging
apiVersion: enonic.cloud/v1
kind: Xp8Config
metadata:
  name: "{{ allNodesKey | raw }}-logback"
  namespace: {{ deployment.namespace }}
  annotations:
    {{ annotationKeys.neverOverwrite }}: true
    {{ annotationKeys.applyPriority }}: "70"
  labels:
    {{ labelKeys.managed }}: true
    {%- for e in defaultLabels | entries %}
    {{ e.key }}: {{ e.value }}
    {%- endfor %}
  ownerReferences: {{ ownerReferences | toJson }}
spec:
  nodeGroup: {{ allNodesKey }}
  file: logback.xml
  dataBase64: false
  data: |-
    <?xml version="1.0"?>
    <configuration scan="true" scanPeriod="60 seconds">

      <appender name="FILE" class="ch.qos.logback.core.rolling.RollingFileAppender">
        <file>${xp.home}/logs/server.log</file>
        <rollingPolicy class="ch.qos.logback.core.rolling.SizeAndTimeBasedRollingPolicy">
          <fileNamePattern>${xp.home}/logs/server.%d{yyyy-MM-dd}.%i.log</fileNamePattern>
          <maxFileSize>100MB</maxFileSize>
          <maxHistory>7</maxHistory>
          <totalSizeCap>3GB</totalSizeCap>
        </rollingPolicy>
        <encoder>
          <pattern>%date{ISO8601} %-5level %logger{36} - %msg%n</pattern>
        </encoder>
      </appender>

      <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
        <withJansi>true</withJansi>
        <encoder>
          <pattern>%date{ISO8601} %-5level %logger{36} - %msg%n</pattern>
        </encoder>
      </appender>

      <root level="info">
        <appender-ref ref="STDOUT"/>
        <appender-ref ref="FILE"/>
      </root>

      <logger name="Events.Service" level="WARN" additivity="false">
        <appender-ref ref="STDOUT"/>
        <appender-ref ref="FILE"/>
      </logger>

      <logger name="Events.Bundle" level="WARN" additivity="false">
        <appender-ref ref="STDOUT"/>
        <appender-ref ref="FILE"/>
      </logger>

    </configuration>
