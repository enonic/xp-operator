apiVersion: v1
kind: ServiceAccount
metadata:
  name: xp-events-sa
  namespace: {{ deployment.namespace }}
  annotations:
    {{ annotationKeys.applyPriority }}: "20"
  ownerReferences: {{ ownerReferences | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: xp-events-role
  namespace: {{ deployment.namespace }}
  annotations:
    {{ annotationKeys.applyPriority }}: "30"
  ownerReferences: {{ ownerReferences | toJson }}
rules:
  - apiGroups:
      - '*'
    resources:
      - pods
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: xp-events-role-bindings
  namespace: {{ deployment.namespace }}
  annotations:
    {{ annotationKeys.applyPriority }}: "40"
  ownerReferences: {{ ownerReferences | toJson }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: xp-events-role
subjects:
  - kind: ServiceAccount
    name: xp-events-sa
    namespace: {{ deployment.namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: xp-events-sa-secret
  namespace: {{ deployment.namespace }}
  annotations:
    {{ annotationKeys.applyPriority }}: "60"
    kubernetes.io/service-account.name: xp-events-sa
type: kubernetes.io/service-account-token
