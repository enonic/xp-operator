{%- if deployment.clustered and not pods.automountServiceAccountToken %}
# Empty token file mounted on the `exp` container at
# /var/run/secrets/kubernetes.io/serviceaccount/token to satisfy the
# Hazelcast Kubernetes discovery plugin's eager file read at startup.
# The content is unused in DNS discovery mode (settings.hzApiDiscovery=false),
# but the file must exist or the plugin throws "Could not get token file".
# Required only for clustered deployments with automountServiceAccountToken=false.
apiVersion: v1
kind: ConfigMap
metadata:
  name: empty-sa
  namespace: {{ deployment.namespace }}
  annotations:
    {{ annotationKeys.applyPriority }}: "60"
  labels:
    {{ labelKeys.managed }}: true
    {%- for e in defaultLabels | entries %}
    {{ e.key }}: {{ e.value }}
    {%- endfor %}
  ownerReferences: {{ ownerReferences | toJson }}
data:
  token: ""
  ca.crt: ""
  namespace: {{ deployment.namespace }}
{%- endif %}
