---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ claim.name }}
  namespace: {{ deployment.namespace }}
  annotations:
    {{ annotationKeys.applyPriority }}: "10"
    {%- for e in storage.shared.annotations | entries %}
    {{ e.key }}: {{ e.value }}
    {%- endfor %}
  labels:
    {{ labelKeys.managed }}: true
    {%- for e in defaultLabels | entries %}
    {{ e.key }}: {{ e.value }}
    {%- endfor %}
  ownerReferences: {{ ownerReferences | toJson }}
spec:
  storageClassName: {{ claim.class | default(storage.shared.storageClassName) }}
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ claim.size }}
