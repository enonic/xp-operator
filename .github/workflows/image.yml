name: Image

# Builds and publishes enonic/xp-operator:<version> for linux/amd64 and linux/arm64.
# Each platform is built on a runner of that architecture, because the operator is compiled to a native executable
# inside the docker build. The two images are then joined under one tag.
on:
  workflow_call:
    inputs:
      version:
        description: Version of the operator, and tag of the image
        required: true
        type: string
      target:
        description: Dockerfile stage to build, the production image if empty
        required: false
        type: string
        default: ''
    secrets:
      DOCKERHUB_TOKEN:
        required: true

env:
  IMAGE: enonic/xp-operator

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set version
        run: sed -i "s/^version *=.*/version = ${{ inputs.version }}/" gradle.properties

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to docker hub
        uses: docker/login-action@v4
        with:
          username: enonicpublisher
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ inputs.target }}
          pull: true
          no-cache: true
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to docker hub
        uses: docker/login-action@v4
        with:
          username: enonicpublisher
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image for all platforms
        working-directory: ${{ runner.temp }}/digests
        run: docker buildx imagetools create -t "$IMAGE:${{ inputs.version }}" $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:${{ inputs.version }}"
