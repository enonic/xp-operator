name: Development

# Publishes <version>-dev<N> from any branch: <version> is read from gradle.properties,
# N is one above the highest existing v<version>-dev<N> tag. The commit is tagged after publishing.
on:
  workflow_dispatch:

concurrency:
  group: publish-dev
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: '3.11.0'

      - name: Setup YQ
        uses: chrisdickinson/setup-yq@latest
        with:
          yq-version: v4.25.1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v6.1.0-20
          platforms: all

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to docker hub
        uses: docker/login-action@v4
        with:
          username: enonicpublisher
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Operator version
        id: operator_version
        run: |
          base="$(./get-version.sh)"
          case "$base" in
            *-*) echo "gradle.properties version '$base' must be a plain release version"; exit 1 ;;
          esac
          git fetch --tags --force --quiet origin
          last=$(git tag -l "v${base}-dev*" | sed -n "s/^v${base//./\\.}-dev\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
          version="${base}-dev$(( ${last:-0} + 1 ))"
          echo "Publishing $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Set dev version
        run: yq -i -p=props -o=props '.version = "${{ steps.operator_version.outputs.version }}"' gradle.properties

      - name: Build operator
        run: ./gradlew build

      - name: Publish docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          pull: true
          no-cache: true
          push: true
          tags: "enonic/xp-operator:${{ steps.operator_version.outputs.version }}"
          platforms: linux/amd64,linux/arm64

      - name: Publish helm chart
        run: curl -u "ci:${{ secrets.ARTIFACTORY_PASSWORD }}" https://repo.enonic.com/helm/ --upload-file helm/build/libs/xp-operator-${{ steps.operator_version.outputs.version }}.tgz --fail-with-body

      - name: Tag commit
        run: |
          git tag "v${{ steps.operator_version.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ steps.operator_version.outputs.version }}"

