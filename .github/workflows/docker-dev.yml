name: Development

# Publishes <version>-dev.<N> from any branch: <version> is read from gradle.properties,
# N is one above the highest existing v<version>-dev.<N> tag. The commit is tagged after publishing.
# The dot keeps N numeric in semver, so dev.10 sorts after dev.2.
on:
  workflow_dispatch:

concurrency:
  group: publish-dev
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.operator_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: '3.11.0'

      - name: Setup YQ
        uses: chrisdickinson/setup-yq@latest
        with:
          yq-version: v4.25.1

      - name: Operator version
        id: operator_version
        run: |
          base="$(./get-version.sh)"
          case "$base" in
            *-*) echo "gradle.properties version '$base' must be a plain release version"; exit 1 ;;
          esac
          git fetch --tags --force --quiet origin
          last=$(git tag -l "v${base}-dev.*" | sed -n "s/^v${base//./\\.}-dev\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
          version="${base}-dev.$(( ${last:-0} + 1 ))"
          echo "Publishing $version"
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Set dev version
        run: yq -i -p=props -o=props '.version = "${{ steps.operator_version.outputs.version }}"' gradle.properties

      - name: Build operator
        run: ./gradlew build

      - name: Upload helm chart
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: helm/build/libs/xp-operator-${{ steps.operator_version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 1

  image:
    needs: build

    uses: ./.github/workflows/image.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-dev:
    runs-on: ubuntu-latest

    needs: [build, image]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download helm chart
        uses: actions/download-artifact@v8
        with:
          name: helm-chart

      - name: Publish helm chart
        run: curl -u "ci:${{ secrets.ARTIFACTORY_PASSWORD }}" https://repo.enonic.com/helm/ --upload-file xp-operator-${{ needs.build.outputs.version }}.tgz --fail-with-body

      - name: Tag commit
        run: |
          git tag "v${{ needs.build.outputs.version }}" "$GITHUB_SHA"
          git push origin "v${{ needs.build.outputs.version }}"
