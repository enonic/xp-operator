[versions]
fabric8 = "7.8.0"
micronaut-gradle-plugin = "5.0.2"
checkstyle = "14.3.0"

[libraries]
fabric8-bom = { module = "io.fabric8:kubernetes-client-bom", version.ref = "fabric8" }

fabric8-kubernetes-client = { module = "io.fabric8:kubernetes-client", version.ref = "fabric8" }
fabric8-kubernetes-clientapi = { module = "io.fabric8:kubernetes-client-api", version.ref = "fabric8" }
fabric8-kubernetes-servermock = { module = "io.fabric8:kubernetes-server-mock", version.ref = "fabric8" }

# JUnit & Mockito
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version = "5.10.0" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version = "5.11.0" }
assertj-core = { module = "org.assertj:assertj-core", version = "3.27.6" }
mockito-core = { module = "org.mockito:mockito-core", version = "5.21.0" }
mockito-inline = { module = "org.mockito:mockito-inline", version = "5.2.0" }
mockito-junitjupiter = { module = "org.mockito:mockito-junit-jupiter", version = "5.21.0" }

# Jackson
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }

# Other
jspecify = { module = "org.jspecify:jspecify", version = "1.0.0" }
pebble = { module = "io.pebbletemplates:pebble", version = "4.1.2" }

[plugins]
micronautApplication = { id = "io.micronaut.application", version.ref = "micronaut-gradle-plugin" }
gitProperties = { id = "com.gorylenko.gradle-git-properties", version = "2.5.4" }
