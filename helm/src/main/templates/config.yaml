{{- if not .Values.onlyDeployCrds }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
data:
  application.properties: |-
    # Api certificates
    quarkus.http.ssl.certificate.file=/deployments/ssl/tls.crt
    quarkus.http.ssl.certificate.key-file=/deployments/ssl/tls.key

    # User defined config
{{ indent 4 .Values.config }}

    # Operator identity — used for namespace lifecycle and RBAC management
    # Rendered last so a duplicate key above cannot override it.
    operator.operator.name={{ .Release.Name }}
    operator.operator.namespace={{ .Release.Namespace }}
    operator.operator.serviceAccountName={{ include "serviceAccountName" . }}
    operator.operator.namespaceRoleName={{ include "namespaceRoleName" . }}
    operator.operator.hazelcastClusterRoleName={{ include "hazelcastClusterRoleName" . }}
    operator.charts.values.labelKeys.managed={{ .Values.managedLabelKey }}
---
{{- end }}