{{- if not .Values.onlyDeployCrds }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
{{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
# Minimal operator ClusterRole — only what the operator process itself needs cluster-wide
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "events", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # Namespace lifecycle
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "delete"]
  # RBAC management
  # rolebindings: only bootstrap (create xp-operator-namespace-access before namespace-role exists)
  # update/patch/delete in managed namespaces are covered by namespace-role RoleBinding
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "create"]
  # clusterrolebindings: hazelcast CRB lifecycle (create via helm, delete on deployment removal)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "create", "patch", "delete"]
  # clusterroles: bind only for known pre-created ClusterRoles (no escalate needed)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["{{ include "hazelcastClusterRoleName" . }}", "{{ include "namespaceRoleName" . }}"]
    verbs: ["bind"]
  # CRD management
  - apiGroups: ["enonic.cloud"]
    resources: ["xp8deployments", "xp8configs"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
# Namespace-role ClusterRole — pre-created; bound per managed namespace via RoleBinding in ensureNamespaceReady()
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "namespaceRoleName" . }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services", "serviceaccounts", "secrets", "events", "persistentvolumeclaims"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["*"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["*"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["*"]
  - apiGroups: ["enonic.cloud"]
    resources: ["xp8deployments", "xp8configs"]
    verbs: ["*"]
---
# Hazelcast ClusterRole — pre-created; replaces the runtime-created per-namespace ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hazelcastClusterRoleName" . }}
rules:
  - apiGroups: ["*"]
    resources: ["nodes"]
    verbs: ["get"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
{{- end }}

{{- define "serviceAccountName" -}}
{{- default .Release.Name .Values.serviceAccount.name -}}
{{- end -}}

{{- define "namespaceRoleName" -}}
{{- default (printf "%s-namespace-role" .Release.Name) .Values.rbac.namespaceRoleName -}}
{{- end -}}

{{- define "hazelcastClusterRoleName" -}}
{{- default (printf "%s-hazelcast" .Release.Name) .Values.rbac.hazelcastClusterRoleName -}}
{{- end -}}
