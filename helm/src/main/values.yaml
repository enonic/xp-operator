image:
  repository: enonic/xp-operator
  tag: "${version}"
  pullPolicy: IfNotPresent
imagePullSecrets: []
podSecurityContext: {}
securityContext: {}
resources:
  requests: {}
  limits: {}
annotations: {}
labels: {}
secrets: {}
env: {}
onlyDeployCrds: false
managedLabelKey: enonic.managed

serviceAccount:
  create: true
  # Empty means {release}.
  name: ""
rbac:
  create: true
  # Empty means {release}-namespace-role and {release}-hazelcast.
  namespaceRoleName: ""
  hazelcastClusterRoleName: ""
webhook:
  enabled: true
apiService:
  enabled: true
admissionPolicy:
  enabled: true

tls:
  # Empty means the chart creates and owns {release}-tls.
  existingSecret: ""
  # Base64 encoded CA certificate for the APIService caBundle.
  caBundle: ""
  # Base64 encoded certificate and key, used instead of generating them.
  crt: ""
  key: ""

# For a full list of configuration options see operator properties file:
# https://github.com/enonic/xp-operator/blob/master/java-operator/src/main/resources/application.properties
config: |-
  #operator.charts.values.storage.shared.storageClassName=nfs
  #operator.charts.values.storage.default.storageClassName=standard

  #operator.charts.values.resources.cpu.defaultRequests=0.2
  #operator.charts.values.resources.memory.defaultRequests=512Mi
